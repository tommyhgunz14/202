<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model viewer</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/utils/BufferGeometryUtils.js": "../vendor/BufferGeometryUtils.js", "three/addons/loaders/GLTFLoader.js": "../vendor/GLTFLoader.js" } }</script>
<style>body{margin:0;background:#22262b;color:#ddd;font:12px monospace}canvas{display:block}#info{position:fixed;left:8px;top:8px;white-space:pre}</style>
</head>
<body>
<div id="info"></div>
<script type="module">
// /tools/viewer.html?name=uboat_viic[&code=1]  — renders the normalised GLB (or the code asset
// with code=1) from front, starboard, top and three-quarter, with the named nodes marked.
import * as THREE from 'three';
import { loadModel } from '../src/models.js';
const q = new URLSearchParams(location.search);
const name = q.get('name') || 'uboat_viic';
const mod = await import(`../assets/${name}.js`);
const proto = mod.default(THREE);
const kind = proto.userData.type === 'aircraft' ? 'aircraft' : 'vessel';
let obj = q.get('code') ? proto : await loadModel(name, proto, kind);
const info = document.getElementById('info');
if (!obj) { info.textContent = `no GLB for ${name}`; obj = proto; }
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x22262b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 2.0)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 9, 7); scene.add(sun);
scene.add(obj);
// mark named nodes
obj.updateMatrixWorld(true);
const names = [];
obj.traverse((n) => { if (n.name && n !== obj) { const p = new THREE.Vector3(); n.getWorldPosition(p); names.push(`${n.name} (${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})`); const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshBasicMaterial({ color: n.name === 'prop' ? 0xff4040 : 0x40ff40 })); m.position.copy(p); scene.add(m); } });
const box = new THREE.Box3().setFromObject(obj); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
scene.add(new THREE.AxesHelper(size.z * 0.6));
const L = Math.max(size.x, size.y, size.z);
const cams = [['front (+Z toward you)', new THREE.Vector3(0, 0.25, 1)], ['starboard side', new THREE.Vector3(-1, 0.2, 0)], ['top', new THREE.Vector3(0, 1, 0.001)], ['three-quarter', new THREE.Vector3(-0.7, 0.5, 0.8)]];
const W = innerWidth / 2, H = innerHeight / 2;
function render() {
  renderer.setScissorTest(true);
  cams.forEach(([label, dir], i) => {
    const x = (i % 2) * W, y = (1 - Math.floor(i / 2)) * H;
    renderer.setViewport(x, y, W, H); renderer.setScissor(x, y, W, H);
    const cam = new THREE.PerspectiveCamera(35, W / H, 0.1, 5000);
    cam.position.copy(c).addScaledVector(dir.clone().normalize(), L * 1.9); cam.lookAt(c);
    renderer.render(scene, cam);
  });
  renderer.setScissorTest(false);
}
render();
info.textContent = `${name}  size ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)} m  (x=beam, y=height, z=length)\nviews: TL front (+Z faces camera)  TR starboard  BL top  BR 3/4\n` + names.join('\n');
</script>
</body>
</html>
