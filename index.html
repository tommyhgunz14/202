<style>
  :root { --paper: #e7dfc8; --ink: #1c1a16; --blue: #1f3468; --red: #a02a30; --brass: #b08d3e; --ok: #4fa36a; --bad: #d84a3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1b2a; font-family: "Gill Sans", "Trebuchet MS", "Segoe UI", sans-serif; color: var(--paper); }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #grade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(255, 236, 205, 0.10) 0%, rgba(255, 220, 180, 0.03) 45%, rgba(30, 18, 10, 0.32) 100%); mix-blend-mode: soft-light; }
  /* menus */
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(8,20,32,0.25), rgba(4,10,18,0.7)); overflow: auto; padding: 20px; }
  .title-card { text-align: center; max-width: 720px; }
  /* the squadron badge, with its motto and what it means */

  .plan { max-width: 1040px; }
  .plan-photo { height: min(260px, 30vh); margin: -18px -18px 12px; background-size: cover; background-position: center; position: relative; border-radius: 6px 6px 0 0; box-shadow: inset 0 -80px 90px -30px rgba(10, 12, 14, 0.95); }
  .plan-photo span { position: absolute; left: 14px; bottom: 8px; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #cfc8b2; text-shadow: 0 1px 4px #000; }
  .plan-cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }
  .plan .aim { margin: 0 0 10px; color: #ded7c2; }
  .plan-list { margin: 0; padding-left: 20px; color: #c9c2ac; }
  .plan-list li { margin: 3px 0; }
  .plan .role { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 9px 12px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(200, 178, 122, 0.35); border-radius: 4px; color: inherit; font: inherit; cursor: pointer; }
  .plan .role.sel { border-color: var(--brass); background: rgba(200, 178, 122, 0.16); }
  .plan .role b { display: block; color: var(--brass); font-size: 15px; letter-spacing: 0.5px; }
  .plan .role b em { font-style: normal; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #9fb6c8; border: 1px solid rgba(159, 182, 200, 0.5); border-radius: 3px; padding: 1px 5px; margin-left: 8px; vertical-align: 2px; }
  .plan .role span { display: block; margin-top: 3px; font-size: 13px; color: #b9b2a0; }
  .plan .only { color: #b9b2a0; font-size: 13.5px; }
  @media (max-width: 860px) { .plan-cols { grid-template-columns: 1fr; } }
  .badge { margin: 0 auto 8px; padding: 10px 40px 6px; display: flex; flex-direction: column; align-items: center; background: radial-gradient(closest-side, rgba(8, 12, 16, 0.5), rgba(8, 12, 16, 0)); }
  .badge img { height: min(250px, 30vh); width: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55)); animation: badge-in 1.6s ease-out both; }
  .badge figcaption { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; animation: badge-in 1.6s ease-out 0.5s both; }
  .badge .motto { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 17px; letter-spacing: 3px; color: var(--brass); }
  .badge .gloss { font-size: 12.5px; letter-spacing: 1.5px; color: #c9c2ac; }
  @keyframes badge-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-height: 640px) { .badge figcaption { flex-direction: row; gap: 10px; } }
  h1 { font-size: 44px; margin: 4px 0; letter-spacing: 1px; font-weight: 600; }
  h2 { font-size: 18px; font-weight: 400; margin: 2px 0 12px; color: #c9c2ac; letter-spacing: 2px; text-transform: uppercase; }
  h3 { margin: 14px 0 6px; font-weight: 600; color: var(--brass); font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  .tag { color: #bfb9a5; font-size: 16px; }
  .hint, .small { color: #9d9884; font-size: 12.5px; }
  .card { background: rgba(14, 22, 30, 0.92); border: 1px solid rgba(176,141,62,0.45); border-radius: 6px; padding: 22px 28px; max-width: 980px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .card h1 { font-size: 30px; }
  .card .sub { color: #bfb9a5; margin-top: -4px; }
  .brief { font-size: 15px; line-height: 1.5; color: #e2dcc8; }
  .menu { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; align-items: center; }

  /* photograph archive */

  .plate { display: block; text-align: left; padding: 0; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(176,141,62,0.35); }
  .plate:hover { background: rgba(255,255,255,0.12); outline: 1px solid var(--brass); }
  .plate .pimg { display: block; width: 100%; aspect-ratio: 16 / 9; background-size: cover; background-position: center; background-color: #10171d; filter: sepia(0.18) contrast(1.04); }
  .plate b { display: block; padding: 7px 9px 0; font-size: 13.5px; font-weight: 600; }

  .plate-big { display: block; width: 100%; max-height: 56vh; object-fit: contain; background: #0a0f14; border: 1px solid rgba(176,141,62,0.35); border-radius: 3px; margin-bottom: 10px; }
  .missing { color: var(--bad); }
  .ac-ref { display: block; width: 100%; max-height: 240px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(176,141,62,0.35); margin-bottom: 8px; }
  /* cinematic panel on the sortie screen: five slides, each shown 5 s, cross-fading with a push-in */
  .cine { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; border: 1px solid rgba(176,141,62,0.35); margin-bottom: 12px; background: #000; }
  .cine .cslide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; filter: sepia(0.2) saturate(0.9) contrast(1.05); animation: cine 25s linear infinite; }
  .cine i { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
  @keyframes cine { 0% { opacity: 0; transform: scale(1); } 4% { opacity: 1; } 20% { opacity: 1; transform: scale(1.08); } 24% { opacity: 0; transform: scale(1.09); } 100% { opacity: 0; transform: scale(1); } }
  .ac-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .ac-detail { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
  .spec { border-collapse: collapse; font-size: 13px; width: 100%; }
  .spec td { padding: 3px 8px 3px 0; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .spec td:first-child { color: #bfb9a5; width: 90px; white-space: nowrap; }
  .score { display: grid; grid-template-columns: 90px 1fr 28px; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  .score i { display: block; height: 10px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .score b { display: block; height: 100%; background: linear-gradient(90deg, #6f8fc9, #b08d3e); }
  .score.total { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; font-weight: 600; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .controls table { font-size: 13px; border-collapse: collapse; }
  .controls td { padding: 3px 10px 3px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .controls td:first-child { color: var(--brass); white-space: nowrap; font-family: monospace; }
  .orb pre { background: #efe8d3; color: #2a2418; font-family: "Courier New", monospace; font-size: 12px; padding: 12px; border-radius: 3px; white-space: pre-wrap; max-height: 32vh; overflow: auto; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  code { background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px; }
  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 18px; flex-wrap: wrap; padding: 8px 14px; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0)); font-size: 13px; font-family: monospace; }
  #hud-top b { color: #ffd27a; }
  #hud-objectives { position: absolute; top: 44px; left: 14px; font-size: 13.5px; background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 4px; max-width: 360px; }
  #hud-objectives .done { color: var(--ok); } #hud-objectives .failed { color: var(--bad); text-decoration: line-through; }
  #hud-log { position: absolute; left: 14px; bottom: 14px; width: 520px; font-size: 13px; background: rgba(0,0,0,0.38); padding: 8px 10px; border-radius: 4px; line-height: 1.35; }
  #hud-log .ok { color: #8fe0a7; } #hud-log .bad { color: #ff8a7a; }
  #hud-contact { position: absolute; top: 44px; right: 14px; font-size: 13px; background: rgba(0,0,0,0.4); padding: 8px 10px; border-radius: 4px; display: none; text-align: right; }
  #hud-contact .refcard { display: block; width: 220px; height: 124px; object-fit: cover; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; margin: 0 0 6px auto; }
  .idbar { display: inline-block; width: 120px; height: 6px; background: rgba(255,255,255,0.15); vertical-align: middle; margin-right: 6px; }
  .idbar i { display: block; height: 100%; background: #ffd27a; }
  #hud-warn { position: absolute; top: 46%; left: 0; right: 0; text-align: center; color: #ff7a5a; font-weight: 700; font-size: 24px; letter-spacing: 6px; text-shadow: 0 0 8px #000; }
  #hud-guide { position: absolute; top: 60%; left: 0; right: 0; text-align: center; color: #ffd27a; font-family: monospace; font-size: 14px; text-shadow: 0 0 6px #000; }
  #track-tag { position: absolute; display: none; transform: translate(-50%, -140%); padding: 2px 6px; font-family: monospace; font-size: 11px; color: #ffd27a; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,210,122,0.5); border-radius: 3px; white-space: nowrap; }
  .friend-tag { position: absolute; display: none; transform: translate(-50%, -150%); padding: 1px 6px; font-family: monospace; font-size: 11px; color: #cfe6ff; background: rgba(10,20,40,0.45); border: 1px solid rgba(150,200,255,0.45); border-radius: 3px; white-space: nowrap; pointer-events: none; z-index: 5; }
  body:not(.flying) .friend-tag, body.cine .friend-tag { display: none !important; }
  #track-tag::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -1px; width: 2px; height: 10px; background: rgba(255,210,122,0.7); }
  #reticle { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border: 2px solid rgba(255,210,122,0.8); border-radius: 50%; display: none; }
  #reticle::before, #reticle::after { content: ""; position: absolute; background: rgba(255,210,122,0.8); }
  #reticle::before { left: 50%; top: 8px; bottom: 8px; width: 2px; margin-left: -1px; }
  #reticle::after { top: 50%; left: 8px; right: 8px; height: 2px; margin-top: -1px; }
  /* bomb-aimer's sight */
  #bombsight { position: absolute; inset: 0; display: none; }
  #bombsight .grat { position: absolute; left: 50%; top: 20%; bottom: 10%; width: 2px; margin-left: -1px; background: linear-gradient(rgba(255,210,122,0), rgba(255,210,122,0.8) 20%, rgba(255,210,122,0.8) 80%, rgba(255,210,122,0)); }
  #bombsight .drift { position: absolute; left: 30%; right: 30%; top: 62%; height: 2px; background: rgba(255,210,122,0.5); }
  #impact { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 2px solid #ffd27a; border-radius: 50%; box-shadow: 0 0 6px #000; }
  #impact i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #ffd27a; border-radius: 50%; }
  #impact span { position: absolute; left: 40px; top: 6px; white-space: nowrap; font-family: monospace; font-size: 12px; color: #ffd27a; text-shadow: 0 0 4px #000; }
  #impact.on { border-color: #ff5a3a; } #impact.on i { background: #ff5a3a; } #impact.on span { color: #ff5a3a; font-weight: 700; }
  #bombsight .readout { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); font-family: monospace; font-size: 13px; color: #ffd27a; text-shadow: 0 0 4px #000; background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 3px; }
  /* instruments */
  #asv { position: fixed; right: 14px; bottom: 14px; width: 220px; height: 220px; border: 3px solid #2a2d31; border-radius: 6px; background: #0a1a10; display: none; }
  #plot { position: fixed; right: 244px; bottom: 14px; width: 260px; height: 220px; border: 3px solid #2a2d31; border-radius: 6px; display: none; }
  #cockpit { position: fixed; left: 0; top: 0; width: 1400px; height: 520px; display: none; }
  body.flying #asv, body.flying #plot { display: block; }
  /* in the cockpit view the panels lift clear of the instrument panel */
  body.cockpit #hud-log { bottom: 28%; width: 420px; }
  body.cockpit #asv { bottom: 6px; transform: scale(0.68); transform-origin: bottom right; }
  body.cockpit #plot { bottom: 6px; right: 172px; transform: scale(0.68); transform-origin: bottom right; }
  body.cockpit #lever { top: 40%; }

  #lever .ticks { position: absolute; left: 4px; top: 16px; bottom: 16px; width: 28px; }
  #lever .ticks span { position: absolute; right: 0; transform: translateY(-50%); }
  #lever .ias { position: absolute; left: 66px; top: 16px; bottom: 16px; width: 8px; background: #1a1c1f; border: 1px solid #55575b; border-radius: 4px; overflow: hidden; }
  #lever .ias i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#ffd27a, #b8532f); }
  #lever .ias b { position: absolute; left: -2px; right: -2px; height: 2px; background: #ff5a3a; }
  #lever .lbl { position: absolute; left: 0; right: 0; text-align: center; }
  #lever .lbl.top { top: -2px; }
  #lever .val { position: absolute; left: 0; right: 0; text-align: center; top: 300px; color: #ffd27a; font-size: 12px; }
  #pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); flex-direction: column; gap: 10px; }
  #pause h1 { font-size: 36px; }
  @media (max-width: 900px) { .ac-detail, .controls { grid-template-columns: 1fr; } #hud-log { width: 60vw; } #plot { display: none !important; } }
</style>
<style>

  #intro .icard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.5s ease; text-align: center; padding: 0 12vw; }
  #intro .icard.on { opacity: 1; }

  #intro .title .tt { position: relative; }
  #intro .title h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 7vw, 96px); letter-spacing: 0.12em; font-weight: normal; margin: 0; text-shadow: 0 2px 40px rgba(0, 0, 0, 0.85); transform: scale(0.96); transition: transform 6s ease-out; }

  #intro .scenes { padding: 0; }

  #intro .bars i:first-child { top: 0; } #intro .bars i:last-child { bottom: 0; }
  #intro .grain { position: absolute; inset: -20%; pointer-events: none; opacity: 0.13; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.5s steps(4) infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); } 50% { transform: translate(2%, -3%); } 75% { transform: translate(-1%, -2%); } 100% { transform: translate(3%, 1%); } }
  #intro .skip { position: absolute; right: 26px; bottom: 11vh; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.55; cursor: pointer; padding: 6px 10px; border: 1px solid rgba(241,232,210,0.35); border-radius: 3px; }
  /* promotion card: a photograph coming up out of the dark with the citation beside it */

  #promo h2 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 3.6vw, 56px); letter-spacing: 0.18em; text-transform: uppercase; font-weight: normal; margin: 0; }
  #promo .where { color: #d8b56a; letter-spacing: 0.35em; text-transform: uppercase; font-size: 12px; margin: 10px 0 22px; }
  #promo .body { font-family: Georgia, "Times New Roman", serif; font-size: clamp(15px, 1.35vw, 21px); line-height: 1.75; margin: 0; max-width: 34em; }
  #promo .bars i { position: absolute; left: 0; right: 0; height: 9vh; background: #000; }
  #promo .bars i:first-child { top: 0; } #promo .bars i:last-child { bottom: 0; }
  #promo .skip { position: absolute; right: 26px; bottom: 11vh; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.55; cursor: pointer; padding: 6px 10px; border: 1px solid rgba(241,232,210,0.35); border-radius: 3px; }
  @media (max-width: 900px) { #promo { grid-template-columns: 1fr; } #promo .txt { grid-column: 1; padding: 0 8vw; } }
  /* mission-start cinematic: letterbox bars, no instruments until the crew are aboard */
  /* crew walk-out as film: full-bleed footage or stills under the letterbox, fading to the live aircraft */
  #crew-cine { position: fixed; inset: 0; z-index: 25; background: #000; opacity: 0; transition: opacity 1.1s ease; overflow: hidden; pointer-events: none; }
  #crew-cine.in { opacity: 1; }
  #crew-cine.out { opacity: 0; transition-duration: 1.1s; }
  #crew-cine .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.1s ease; filter: sepia(0.12) saturate(0.92) contrast(1.04); }
  #crew-cine .shot.on { opacity: 1; }
  #crew-cine .shot.still { transform: scale(1.02); transition: opacity 1.1s ease, transform 5.5s linear; }
  #crew-cine .shot.still.on { transform: scale(1.1); }
  #crew-cine .grain { position: absolute; inset: -20%; pointer-events: none; opacity: 0.1; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.5s steps(4) infinite; }
  #crew-cine .skip { position: absolute; right: 26px; bottom: 11vh; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.55; color: #f1e8d2; padding: 6px 10px; border: 1px solid rgba(241,232,210,0.35); border-radius: 3px; }
  body.cine::before, body.cine::after { content: ""; position: fixed; left: 0; right: 0; height: 9vh; background: #000; z-index: 30; pointer-events: none; }
  body.cine::before { top: 0; } body.cine::after { bottom: 0; }
  body.cine #hud, body.cine #lever, body.cine #plot, body.cine #asv, body.cine #gun-cam { display: none !important; }
  /* automated gunner window: the GL canvas draws the gunner's view under this frame */
  #gun-cam { position: fixed; top: 44px; right: 14px; width: 300px; display: none; border: 2px solid #c8b27a; border-radius: 4px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); overflow: hidden; font-family: monospace; font-size: 12px; }
  #gun-cam .bar { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: rgba(20, 18, 12, 0.85); color: #f1e8d2; }
  #gun-cam .bar b { color: #e6c77a; letter-spacing: 0.06em; }
  #gun-cam .bar span { color: #ffb37a; }
  #gun-cam .bar span.kill { color: #8ee07a; } #gun-cam .bar span.esc { color: #9fb6c8; }
  #gun-cam .frame { height: 180px; background: transparent; }
  body.pip #gun-cam { display: block; }
  body.pip #hud-contact { top: 260px; }
  /* depth-charge camera: the stick seen from low over the water, from release to the plumes */
  #dc-cam { position: fixed; top: 44px; right: 14px; width: min(340px, 44vw); display: none; border: 2px solid #9fc4d8; border-radius: 4px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); overflow: hidden; font-family: monospace; font-size: 12px; }
  #dc-cam .bar { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: rgba(12, 18, 22, 0.85); color: #e8f0f2; }
  #dc-cam .bar b { color: #bfe0ee; letter-spacing: 0.06em; }
  #dc-cam .bar span { color: #ffd27a; } #dc-cam .bar span.kill { color: #8ee07a; } #dc-cam .bar span.esc { color: #9fb6c8; }
  #dc-cam .frame { aspect-ratio: 17 / 10; background: transparent; }
  body.dccam #dc-cam { display: block; }
  body.dccam #gun-cam { display: none !important; }
  body.dccam #hud-contact { top: 280px; }
  body.cine #dc-cam { display: none !important; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="grade"></div>
<div id="hud">
  <div id="hud-top"></div>
  <div id="hud-objectives"></div>
  <div id="hud-contact"></div>
  <div id="hud-warn"></div>
  <div id="hud-guide"></div>
  <div id="track-tag"></div>
  <div id="reticle"></div>
  <div id="bombsight"><div class="grat"></div><div class="drift"></div><div id="impact"><i></i><span></span></div><div class="readout" id="bs-read"></div></div>
  <div id="hud-log"></div>
</div>
<div id="lever">
  <div class="lbl top">THROTTLE · IAS</div>
  <div class="ticks"><span style="top:0%">FULL</span><span style="top:25%">3/4</span><span style="top:50%">1/2</span><span style="top:75%">1/4</span><span style="top:100%">SHUT</span></div>
  <div class="track"></div><div class="knob" id="lever-knob"></div>
  <div class="ias"><i id="ias-bar"></i><b id="ias-stall"></b></div>
  <div class="val" id="lever-val"></div>
</div>
<canvas id="cockpit"></canvas>
<canvas id="plot" width="260" height="220"></canvas>
<canvas id="asv" width="220" height="220"></canvas>
<div id="pause">
  <h1>Paused</h1>
  <div class="menu">
    <button id="btn-resume" class="primary">Resume</button>
    <button id="btn-view">Switch view</button>
    <button id="btn-abandon">Abandon sortie</button>
  </div>
</div>
<div id="dc-cam"><div class="bar"><b id="dc-cam-title">Depth charges</b><span id="dc-cam-state"></span></div><div class="frame" id="dc-cam-frame"></div></div>
<div id="gun-cam"><div class="bar"><b id="gun-cam-title">Tail gunner</b><span id="gun-cam-state"></span></div><div class="frame" id="gun-cam-frame"></div></div>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
